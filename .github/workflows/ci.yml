name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Security audit (high+)
        run: npm audit --audit-level=high

  # Od 24. 8. 2026 blokujici: typecheck je na 0 chybach, lint na 0 errorech
  # (no-explicit-any je warning - dlouhodoby dluh ~300 mist).
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint -- --max-warnings=500
